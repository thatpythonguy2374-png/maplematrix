<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Maple Matrix - Opening Soon</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      height:100vh;
      overflow:hidden;
      font-family:'Inter',sans-serif;
      background:#020817;
      position:relative;
      color:#fff;
    }

    /* Background Glow */
    .bg{
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at top left, rgba(37,99,235,0.35), transparent 35%),
        radial-gradient(circle at bottom center, rgba(59,130,246,0.18), transparent 25%),
        linear-gradient(to bottom, #020617, #01030b);
      z-index:-3;
    }

    /* Noise Overlay */
    .noise{
      position:absolute;
      inset:0;
      opacity:0.04;
      background-image:url("https://grainy-gradients.vercel.app/noise.svg");
      z-index:-2;
    }

    /* Floating Blur */
    .blur{
      position:absolute;
      width:500px;
      height:500px;
      background:#1d4ed8;
      border-radius:50%;
      filter:blur(140px);
      opacity:0.15;
      top:-120px;
      left:-120px;
      animation:float 8s ease-in-out infinite alternate;
      z-index:-1;
    }

    @keyframes float{
      from{
        transform:translateY(0px);
      }
      to{
        transform:translateY(40px);
      }
    }

    .container{
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:20px;
    }

    .content{
      max-width:900px;
    }

    .tag{
      letter-spacing:8px;
      font-size:12px;
      color:rgba(255,255,255,0.55);
      margin-top:25px;
      margin-bottom:10px;
      text-transform:uppercase;
    }

    h1{
      font-family:'Cormorant Garamond', serif;
      font-size:clamp(70px, 10vw, 150px);
      font-weight:500;
      line-height:0.95;
      color:#d6d6d6;
      text-shadow:0 0 30px rgba(255,255,255,0.05);
    }

    .opening{
      margin-top:35px;
      margin-bottom:15px;
      font-size:15px;
      letter-spacing:5px;
      text-transform:uppercase;
      color:#7dd3fc;
    }

    .desc{
      margin-top:10px;
      color:rgba(255,255,255,0.55);
      font-size:15px;
      line-height:1.8;
      max-width:650px;
      margin-inline:auto;
    }

    .line{
      width:120px;
      height:1px;
      background:rgba(255,255,255,0.15);
      margin:35px auto;
      position:relative;
    }

    .line::before{
      content:'';
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%, -50%);
      width:8px;
      height:8px;
      border-radius:50%;
      background:#60a5fa;
      box-shadow:0 0 20px #60a5fa;
    }


    .footer{
      position:absolute;
      bottom:5px;
      left:50%;
      transform:translateX(-50%);
      font-size:8px;
      letter-spacing:3px;
      color:rgba(255,255,255,0.3);
      text-transform:uppercase;
    }

    .contact {
        text-transform: uppercase;
        color:rgba(255, 254, 254, 0.905);
        margin-top: 50px;
    }

    @media(max-width:768px){

      h1{
        line-height:1.05;
      }

      .desc{
        font-size:14px;
      }

      .opening{
        letter-spacing:3px;
      }
    }

  </style>
</head>

<body>

  <div class="bg"></div>
  <div class="noise"></div>
  <div class="blur"></div>

  <div class="container">
    <div class="content">
    <h1>Maple Matrix</h1>
        
      <div class="tag">Web Development Studio</div>


      <div class="line"></div>

      <div class="opening">
        We’ll Be Opening Soon
      </div>

      <p class="desc">
        Crafting premium digital experiences with modern design,
        elegant interfaces, and powerful development solutions.
        Something exceptional is on the way.
      </p>

      <p class="contact">Contact Us - +91 9582548338</p>

    </div>
  </div>

  <div class="footer">
    © 2026 Maple Matrix — All Rights Reserved
  </div>

</body>
</html>
